# Log rotation for the deterministic-lane replica and the optional gateway.
# Install at /etc/newsyslog.d/com.camelid.enterprise.conf (root:wheel 0644).
#
# macOS runs /usr/sbin/newsyslog hourly at :30, so one hour is the finest
# granularity available here; size the thresholds with that in mind.
#
# The N flag is mandatory on every line.  With no pid_file field and no N,
# newsyslog signals syslogd; and if a pid_file were ever added, the default
# signal is SIGHUP, whose default disposition in these processes is
# termination.  J is bzip2 -- JSONL compresses roughly 10:1.  Sizes are in KB.
#
# logfilename                                              [owner:group]      mode count size  when  flags

# Serving receipts.  The attribution middleware re-opens this file by path for
# every receipt and writes each record with a single write_all, so
# rename-and-recreate rotation is picked up on the very next request: no signal,
# no restart, no torn line.  Nightly or at 10 MB, whichever comes first, two
# weeks retained.
/usr/local/var/camelid-enterprise/receipts/serving.jsonl   _camelid:_camelid  640  14    10240 $D0   NJ

# launchd stdio, replica and gateway.  launchd opens these once at job spawn and
# holds the descriptors, so a rotation while the process is running leaves it
# appending to the ARCHIVE while the fresh file stays empty until the next
# start -- and once that archive ages past `count` it is deleted while still
# open, at which point the daemon writes to an unlinked inode and consumes disk
# invisibly.  These size-only thresholds are therefore a disk-full backstop and
# not a rotation schedule: at RUST_LOG=info neither process should reach them.
# If one of these ever does rotate, `launchctl kickstart -k` the owning job to
# reattach it to a live file.
/usr/local/var/log/camelid-enterprise/lane.err.log         _camelid:_camelid  640  7     5120  *     NJ
/usr/local/var/log/camelid-enterprise/lane.out.log         _camelid:_camelid  640  7     5120  *     NJ
/usr/local/var/log/camelid-enterprise/gateway.err.log      _camelid:_camelid  640  7     5120  *     NJ
/usr/local/var/log/camelid-enterprise/gateway.out.log      _camelid:_camelid  640  7     5120  *     NJ
