# Transparent entry point in front of the deterministic replica Service.
#
# This stock manifest does not configure an identity database or organization
# quota, so it forwards requests unauthenticated. Keep the gateway private
# until an operator provisions identity and enables auth. Kubernetes performs
# replica-pool balancing through the upstream Service, so the gateway itself
# owns no pool or health state.
#
# If you enable auth by mounting a shared identity database and setting
# CAMELID_GATEWAY_IDENTITY_DB, create that database once before these pods
# start -- any CLI subcommand does, e.g. `create-user`. Schema migration is
# serialized under a write lock, but the initial journal_mode=WAL switch on a
# file that does not yet exist is not, so `replicas: 2` starting against an
# absent database can collide and crash-loop. An existing database is safe to
# open concurrently.
#
# The organization quota is per gateway process unless
# CAMELID_GATEWAY_PLATFORM_DATABASE_URL points every replica at one PostgreSQL
# database, dedicated to this deployment -- quota rows are keyed by organization
# and window only, so a second deployment on the same database spends the same
# budget. Because this manifest runs two replicas, the in-process counter admits
# up to 2x the configured limit per window. If you configure the shared counter,
# every replica must use the same database AND the same
# CAMELID_GATEWAY_ORG_REQUEST_QUOTA_WINDOW_SECONDS -- a pod whose window
# disagrees with the recorded one refuses to start, because pods that disagree
# enforce the sum of their limits. To change the window, roll out
# CAMELID_GATEWAY_RECONFIGURE_QUOTA_WINDOW=true with the new value, then drop
# it. Supply the URL from a Secret: it carries a password. See
# deploy/README.md, "Shared quota (PostgreSQL)".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camelid-enterprise-gateway
  labels:
    app: camelid-enterprise-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: camelid-enterprise-gateway
  template:
    metadata:
      labels:
        app: camelid-enterprise-gateway
    spec:
      # Shutdown budget. On SIGTERM the gateway stops accepting, drains active
      # streaming responses, and only then drains its JSONL logs. kubelet sends
      # SIGKILL when this expires, so it has to cover every stage:
      #
      #   terminationGracePeriodSeconds
      #     >= CAMELID_GATEWAY_MAX_CONNECTION_SECONDS   (300, connection drain)
      #      + 5s per configured JSONL log              (audit + usage = 10s)
      #      + margin                                   (20s)
      #
      # 300 + 10 + 20 = 330. Setting this equal to the connection cap -- as it
      # was -- leaves zero budget for the log drain: one connection accepted
      # just before SIGTERM can consume the whole period, and the logs are then
      # killed mid-drain. If you raise the connection cap, raise this too.
      terminationGracePeriodSeconds: 330
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: camelid-enterprise-gateway:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CAMELID_GATEWAY_ADDR
              value: "0.0.0.0:8080"
            - name: CAMELID_GATEWAY_UPSTREAM
              value: "http://camelid-enterprise-deterministic"
            - name: CAMELID_GATEWAY_MAX_IN_FLIGHT
              value: "256"
            - name: CAMELID_GATEWAY_MAX_CONNECTION_SECONDS
              value: "300"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # `readOnlyRootFilesystem` leaves no writable path at all; this is
        # unused today (the gateway writes nothing) but keeps a dependency
        # that ever needs a scratch file from failing silently.
        - name: tmp
          emptyDir: {}