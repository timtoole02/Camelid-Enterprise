# Isolate deterministic replicas from direct pod-to-pod access. Client
# workloads enter through the gateway; node-originated Kubernetes probes remain
# allowed by NetworkPolicy semantics.
#
# This resource requires a CNI plugin that enforces networking.k8s.io/v1
# NetworkPolicy. Without one, the Kubernetes API accepts it but no traffic is
# filtered. Namespace RBAC must also prevent untrusted workloads from claiming
# the gateway label. Node and hostNetwork-originated access is outside this
# policy's enforceable boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: camelid-enterprise-replica-ingress
  labels:
    app: camelid-enterprise
    lane: deterministic
spec:
  podSelector:
    matchLabels:
      app: camelid-enterprise
      lane: deterministic
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: camelid-enterprise-gateway
      ports:
        - protocol: TCP
          port: 8181