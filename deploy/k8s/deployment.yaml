# Deterministic-lane replica pool for one model.
#
# The deterministic lane scales horizontally: each replica serves one model,
# one generation at a time, so aggregate throughput is set by `replicas` and
# per-tenant routing happens at the gateway/ingress above this Service.
# Requests and limits are equal (Guaranteed QoS) on purpose — the lane's
# behavior is scoped to a hardware class, so replicas should not float across
# heterogeneous nodes or get throttled unpredictably. Pin node selection to
# one instance type per pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camelid-enterprise-deterministic
  labels:
    app: camelid-enterprise
    lane: deterministic
spec:
  replicas: 3
  selector:
    matchLabels:
      app: camelid-enterprise
      lane: deterministic
  template:
    metadata:
      labels:
        app: camelid-enterprise
        lane: deterministic
    spec:
      # REQUIRED, not a preference — the replica does not start without it after
      # the first rollout.
      #
      # Kubernetes derives legacy Docker-link variables from Service names and
      # injects them into every pod scheduled *after* the Service exists. This
      # repository ships two Services whose names begin with the prefix the
      # replica's startup admission scan claims, so a pod gets sixteen
      # CAMELID_-prefixed variables it never asked for, and the scan refuses to
      # start under variables it cannot classify.
      #
      # The timing is what makes this expensive to discover: the first rollout's
      # pods precede the Services, so it comes up clean, and every rollout after
      # it fails. The replica's refusal message recognizes the shape and names
      # this setting, so the same failure on a Service you add yourself is
      # self-diagnosing — but it should never have to fire here.
      #
      # The gateway Deployment deliberately does not set this: the gateway runs
      # no admission scan, and adding it there for symmetry would imply the
      # setting is cosmetic.
      enableServiceLinks: false
      # nodeSelector:
      #   node.kubernetes.io/instance-type: <one instance type per pool>
      containers:
        - name: server
          image: camelid-enterprise:0.1.0
          args: ["--model", "/models/model.gguf", "--serving-receipts", "/receipts/serving.jsonl"]
          env:
            - name: CAMELID_ENTERPRISE_ADDR
              value: "0.0.0.0:8181"
          ports:
            - containerPort: 8181
              name: http
          resources:
            requests:
              cpu: "8"
              memory: 6Gi
            limits:
              cpu: "8"
              memory: 6Gi
          # Listening is not readiness: the model loads after bind, so probe
          # for a non-empty model list before admitting traffic.
          startupProbe:
            exec:
              command: ["sh", "-c", "curl -sf http://127.0.0.1:8181/v1/models | grep -q '\"id\"'"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -sf http://127.0.0.1:8181/v1/models | grep -q '\"id\"'"]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: receipts
              mountPath: /receipts
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: camelid-models
            readOnly: true
        - name: receipts
          emptyDir: {}
