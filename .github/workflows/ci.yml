name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    # exercises engine-linux (x86_64)
          - os: macos-latest     # exercises engine-macos (aarch64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Dev-profile tests: logic and format parity are profile-independent,
      # and the fat-LTO release profile is too slow for per-push CI.
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
        continue-on-error: true # informational until the port stabilizes

  # The shared quota is the first thing here whose correctness is a property of
  # two processes and one database, and none of it can be observed without a
  # real PostgreSQL: the `ON CONFLICT ... WHERE` re-evaluation, the advisory
  # lock that keeps concurrent pods from colliding during migration, and the
  # database-clock window alignment are all server behaviour.
  #
  # A separate job rather than a step in `test`: that job also runs on
  # macos-latest, where service containers do not exist. The tests skip
  # themselves when no URL is configured, which is what keeps the workspace
  # suite runnable on a laptop — and is also exactly how a suite silently
  # becomes zero tests. `CAMELID_REQUIRE_PLATFORM_DATABASE_TESTS` is set only
  # here, and a test asserts on it, so a broken service container fails this
  # job instead of passing it empty. (`CI` would not do: GitHub sets it in
  # every job, including the ones with no database.)
  platform-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: camelid
          POSTGRES_PASSWORD: camelid
          POSTGRES_DB: camelid_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test creates and drops its own database on this server: quota
      # configuration and the schema version are deployment-wide singletons, so
      # tests sharing one database would be testing each other.
      CAMELID_TEST_PLATFORM_DATABASE_URL: postgresql://camelid:camelid@127.0.0.1:5432/camelid_platform
      CAMELID_REQUIRE_PLATFORM_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p camelid-enterprise-platform-store
      - run: cargo test -p camelid-enterprise-gateway --test platform_quota

  # The only job that builds for Windows at all. Without it the server crate's
  # `#[cfg(windows)]` arms — the case-insensitive environment scan in the lane —
  # were compiled by nothing, and engine-windows's probe, which compiles
  # anywhere but only resolves through the Windows detection backend here, was
  # never once run against that backend.
  windows-check:
    runs-on: windows-latest
    # The pinned engine contains evidence paths that reach 262 characters under
    # the runner's default C:\Users\runneradmin\.cargo checkout root. Keep the
    # dependency cache on a short drive-root path so Cargo can fetch it before
    # this job reaches any of our Windows code.
    env:
      CARGO_HOME: D:\c
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Allow the pinned engine's long evidence paths
        run: git config --global core.longpaths true
      - uses: Swatinem/rust-cache@v2
      # engine-windows's tests are not gated on `target_os`, so they also run on
      # the two runners above. Running them here is what makes them mean
      # something: this is the only place `probe` resolves its features through
      # the Windows detection backend rather than through HWCAP or Apple's.
      - run: cargo test -p camelid-enterprise-engine-windows
      # The server crate has Windows-only code and, before this job, no target
      # that compiled it. `--all-targets` so the test files compile too.
      # Checked and not tested deliberately: this project does not yet assert
      # that the workspace suite passes on Windows, and `cargo test` here would
      # be asserting it. Compilation is the claim this job is entitled to make.
      - run: cargo check -p camelid-enterprise --all-targets

  # The aarch64 feature-detection branches are #[cfg]-gated out of the x86_64
  # test runners above, so they never compile there. Cross-check them so the
  # ARM paths can't rot silently. `cargo check` does not link, so a target's
  # prebuilt std (via rustup) is sufficient for these two crates — neither has
  # a dependency with a C build script, which is the thing rustup's std does
  # not substitute for. (macOS aarch64 is already exercised natively by the
  # macos-latest runner.)
  aarch64-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` so the `#[cfg(test)]` modules compile for these targets
      # too. Without it a test module can stop compiling on the one leg no
      # runner executes, and nothing anywhere says so.
      - run: cargo check -p camelid-enterprise-engine-windows --all-targets --target aarch64-pc-windows-msvc
      - run: cargo check -p camelid-enterprise-engine-linux --all-targets --target aarch64-unknown-linux-gnu

      # The server crate cannot be cross-checked for aarch64-pc-windows-msvc
      # from here: a transitive C dependency's build script needs an MSVC
      # toolchain that rustup's prebuilt std does not supply, so the build fails
      # before it reaches any Rust of ours. What is checkable without a
      # toolchain is the resolved dependency graph — and one edge in it makes
      # that target unbuildable on any host.
      #
      # sha2's `asm` feature pulls in sha2-asm, whose build script assembles
      # GNU-syntax `.S` sources with `-march=`; there is no MASM/armasm64 path
      # in that crate, and cc-rs routes *-pc-windows-msvc to cl.exe/lib.exe. On
      # aarch64 sha2 never calls into it — it routes to intrinsics plus the soft
      # backend — so the edge buys nothing there and costs the target entirely.
      - name: sha2's assembly helper stays out of the Windows dependency graph
        run: |
          set -euo pipefail
          graph=$(cargo tree -p camelid-enterprise --target aarch64-pc-windows-msvc -i sha2-asm 2>/dev/null)
          if printf '%s\n' "$graph" | grep -q '^sha2-asm'; then
            echo "sha2-asm resolved into the aarch64-pc-windows-msvc graph of crates/server:"
            printf '%s\n' "$graph"
            echo
            echo "That target cannot be built while it is there, on any host. Narrow the"
            echo "target cfg that turns on sha2's 'asm' feature in crates/server/Cargo.toml"
            echo "so it excludes the MSVC environment; the feature is a no-op on aarch64"
            echo "beyond adding this build-script dependency."
            exit 1
          fi

  # `broken_intra_doc_links` is a rustdoc lint, so neither `cargo test` nor
  # `cargo clippy` evaluates it: a rename that orphans a doc link still
  # compiles, still passes every test, and ships pointing at nothing. That
  # happened during the token-expiry work and was caught by re-reading rather
  # than by tooling, which is the gap this closes.
  #
  # Denied by name rather than through a blanket `-D warnings`: engine-core
  # carries two pre-existing `private_intra_doc_links` warnings, and denying
  # everything would fail this job on those instead of on the defect it exists
  # to catch. Widen the deny list only alongside fixing what it then covers.
  #
  # Rustdoc output does not vary by platform, so one runner is enough.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
