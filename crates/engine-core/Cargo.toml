[package]
name = "camelid-enterprise-engine-core"
description = "Platform-neutral Camelid engine: GGUF loading, tokenization, deterministic decoding, and model lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "engine_core"

[dependencies]
# Parallelism across independent output rows of a linear projection. The
# global pool this uses is the one the serving binary sizes with --threads,
# so the published worker width describes work that actually happens.
rayon = "1"
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
