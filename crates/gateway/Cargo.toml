[package]
name = "camelid-enterprise-gateway"
description = "Transparent HTTP gateway for Camelid Enterprise inference replicas."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "camelid-enterprise-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
identity.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }