[package]
name = "camelid-enterprise-gateway"
description = "Transparent HTTP gateway for Camelid Enterprise inference replicas."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "camelid-enterprise-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fastrand = "2"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "server-graceful", "service", "tokio"] }
identity.workspace = true
pin-project-lite = "0.2"
# The public route surface, linked rather than restated. This crate is
# dependency-free precisely so a gateway can take it without taking the engine.
replica-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
camelid = { git = "https://github.com/timtoole02/Camelid", rev = "b4e3a9056567ed8145fc4fa29850d6f1f261ac2b" }
camelid-enterprise = { path = "../server" }
futures-util = "0.3"
http-body-util = "0.1"
rayon = "1"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
